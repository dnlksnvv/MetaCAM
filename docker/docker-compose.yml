services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    env_file:
      - ../.env
    volumes:
      - frontend_dist:/dist
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    environment:
      # For single-user LAN usage you can also set CORS allow-list in code later.
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist all backend filesystem state (projects/configs/artifacts).
      - backend_data:/app/backend/data
    expose:
      - "8081"
    restart: unless-stopped

  nginx:
    depends_on:
      - frontend
      - backend
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  backend_data:
  frontend_dist:
