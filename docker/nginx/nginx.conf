worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Docker embedded DNS (service name -> container IP). Needed so nginx can
  # re-resolve 'backend' if its IP changes after a restart/recreate.
  resolver 127.0.0.11 valid=10s ipv6=off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

  # Single-user friendly rate limiting (burst allows UI to stay responsive).
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;

  # Simple proxy cache for GET/HEAD API responses (avoid caching POST).
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=128m inactive=10m use_temp_path=off;

  upstream metacam_backend {
    zone metacam_backend 64k;
    server backend:8081 resolve;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # --- API ---
    location ^~ /api/v1/ {
      limit_req zone=api_per_ip burst=20 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://metacam_backend;

      # Cache only safe methods; bypass on Authorization/cookies.
      proxy_cache api_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_bypass $http_authorization $cookie_session;
      proxy_no_cache $http_authorization $cookie_session;
      proxy_cache_valid 200 1m;
      proxy_cache_valid 404 10s;

      add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Static frontend ---
    root /usr/share/nginx/html;
    index index.html;

    # Cache immutable assets aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}

